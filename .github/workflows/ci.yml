name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fastvla-eval

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0 pytest==8.3.3 numpy==1.26.4 pybind11==3.1.0 pyyaml

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Build the C++ labeler
        run: bash fastvla/labeler/build.sh
        env:
          PY: python

      - name: CPU tests
        # The GJK analytic cases, the labeler-parity artefact gate, the metrics exposition
        # format and the empty-source guard. Tests that need the research tree or a GPU
        # skip themselves; -rs lists what skipped so a silent skip cannot hide a gap.
        run: python -m pytest tests/ -q -rs
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/fastvla/labeler

      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob("deploy/k8s/*.yaml")):
              for d in yaml.safe_load_all(open(f)):
                  if d is None:
                      continue
                  if "kind" not in d or "apiVersion" not in d:
                      bad.append(f)
          print("checked", len(glob.glob("deploy/k8s/*.yaml")), "manifest files")
          sys.exit(1 if bad else 0)
          PY

      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config --quiet

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Only push from main in this repository; a fork's PR has no package permission.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        # A hosted runner starts with ~14 GB free. Even the CPU image plus buildx cache is
        # tight once the preinstalled toolchains are there, so they go first.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.cpu
          push: true
          tags: |
            ${{ env.IMAGE }}:cpu-latest
            ${{ env.IMAGE }}:cpu-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the CPU tests inside the pushed image
        run: |
          docker run --rm ${{ env.IMAGE }}:cpu-${{ github.sha }} \
            python -m pytest tests/ -q -rs

      - name: Note on the GPU image
        run: |
          echo "The GPU image (deploy/Dockerfile) is NOT built here."
          echo "Base nvidia/cuda:12.1.1-cudnn8-runtime is ~3 GB and torch cu121 adds ~5 GB"
          echo "installed, which does not fit a hosted runner's free disk alongside the"
          echo "build cache. It is built on a GPU host; see README.md."
