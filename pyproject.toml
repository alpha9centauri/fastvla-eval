[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastvla-eval"
version = "0.1.0"
description = "Fast, correct closed-loop evaluation harness for VLA policies on LIBERO-Safety"
authors = [{ name = "Varun Chandra", email = "alpha9centauri@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["vla", "robotics", "evaluation", "libero", "openvla", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately no runtime dependencies. The harness runs inside the environment that
# already holds the policy, LIBERO-Safety, MuJoCo and torch (see audit/AUDIT.md); pinning
# them here would invite pip to resolve a second, different stack underneath a measurement.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.0"]

[project.urls]
Homepage = "https://github.com/alpha9centauri/fastvla-eval"
Benchmarks = "https://github.com/alpha9centauri/fastvla-eval#benchmark"

[tool.setuptools.packages.find]
# Only the library. bench/, audit/, tests/ and deploy/ are run from a checkout, not
# installed, and without this setuptools refuses to guess between them.
include = ["fastvla*"]

[tool.setuptools.package-data]
"fastvla.labeler" = ["*.so"]

# Python version tracks the libero-vla conda env (3.10.20), which runs every
# rollout and therefore every parity comparison.

[tool.ruff]
line-length = 100
target-version = "py310"
# audit/run_with_alert.py is a verbatim copy of research code (see its header and
# audit/PROVENANCE.txt). It is excluded so no formatter or fixer can touch it; its md5 is
# checked by tests/test_wrapper_copy_verbatim.py.
extend-exclude = ["audit/t1_out", "audit/traces", "audit/run_with_alert.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "NPY"]
ignore = [
  "E501",    # line length is enforced by the formatter
  "B008",    # function call in default arg: common and deliberate in configs
  "C408",    # dict(a=1) over {"a": 1}: the research code this interoperates with uses the
             # call form throughout (e.g. the driver's TASKS list), and matching it matters
             # more than the micro-optimisation.
]

# PTH (pathlib-over-os.path) is deliberately not selected. Every module here mirrors or
# calls into research code that uses os.path, and the audit scripts are read side by side
# with it; switching idiom inside the seam would make the diff harder to follow than the
# rule is worth.

[tool.ruff.lint.per-file-ignores]
# These scripts must mutate sys.path and import `rollout_bootstrap` before anything that
# pulls in openvla_utils -- the stub shim is what keeps TensorFlow out of inference. The
# import order is a hard requirement from PROJECT_HANDOFF.md, not a style slip.
# I001 too: sorting these imports would put profile_hooks above rollout_bootstrap, and
# the bootstrap shim must be imported first or TensorFlow is pulled into inference.
"audit/t2_breakdown.py" = ["E402", "I001"]
"audit/t4_labeler.py" = ["E402"]
# Same bootstrap-first requirement: these all import rollout_bootstrap before anything
# that pulls in openvla_utils, and sorting the block would break it.
"fastvla/labeler/bench_stages.py" = ["E402", "I001"]
"fastvla/labeler/bench_parity.py" = ["E402", "I001"]
"fastvla/labeler/bench_call.py" = ["E402", "I001"]
"fastvla/labeler/bench_contacts.py" = ["E402", "I001"]
"fastvla/run_with_labeler.py" = ["E402", "I001"]
"bench/capture_requests.py" = ["E402", "I001"]
"fastvla/server/bench_forward.py" = ["E402", "I001"]
"fastvla/server/probe_batching.py" = ["E402", "I001"]
"fastvla/server/probe_batched_parity.py" = ["E402", "I001"]
"fastvla/server/probe_mixed_batch.py" = ["E402", "I001"]
"fastvla/server/server.py" = ["E402", "I001"]
"fastvla/sim/worker.py" = ["E402", "I001"]
"bench/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fastvla"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: needs GPU 1 (never GPU 0); not collected by default in CI",
  "slow: minutes, not seconds",
]
